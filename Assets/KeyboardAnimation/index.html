<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XAssistant 键盘热力图</title>
<style>
  :root {
    --bg: #1c1f26;
    --panel: #232833;
    --key-bg: #2d3342;
    --key-border: #3a4154;
    --text: #d7dce8;
    --text-dim: #8b93a7;
    --amber: #ffd54f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 12px;
    overflow: hidden;
    user-select: none;
  }
  .title { font-size: 13px; color: var(--text-dim); letter-spacing: 1px; }
  .title b { color: var(--text); }
  body.transparent { background: transparent; }
  body.transparent .keyboard,
  body.transparent .stat,
  body.transparent .recent,
  body.transparent .mouse,
  body.transparent .toolbar { background: rgba(35, 40, 51, 0.55); }
  body.transparent .keyboard { box-shadow: none; border-color: rgba(62, 70, 92, 0.6); }
  body.transparent .title { opacity: 0.75; }

  /* ---------- 工具栏 ---------- */
  .toolbar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; justify-content: center; }
  .toolbar .sep { width: 1px; height: 18px; background: var(--key-border); margin: 0 8px; }
  .layout-btn, .mode-btn {
    background: var(--key-bg);
    border: 1px solid var(--key-border);
    border-radius: 6px;
    color: var(--text);
    padding: 3px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .layout-btn:hover, .mode-btn:hover { background: #39415a; }
  .layout-btn.active, .mode-btn.active { background: #4c9fe8; border-color: #4c9fe8; color: #0d1117; font-weight: 700; }

  /* ---------- 2D 键盘 ---------- */
  .keyboard {
    background: var(--panel);
    border: 1px solid #2e3444;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,.45);
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 1080px;
  }
  .kb-left { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .kb-right { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .kb-column { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 5px; }
  .key {
    flex: 1 1 0;
    min-width: 0;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--key-bg);
    border: 1px solid var(--key-border);
    border-bottom: 3px solid #1f2430;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #eef1f8;
    transition: background .25s ease, transform .12s ease, box-shadow .25s ease;
    will-change: transform;
    overflow: hidden;
  }
  .key .cap-label { pointer-events: none; z-index: 2; text-shadow: 0 1px 2px rgba(0,0,0,.5); font-size: 12px; }
  .key .badge {
    position: absolute; right: 3px; bottom: 2px;
    font-size: 9px; font-weight: 700; color: rgba(255,255,255,.85);
    text-shadow: 0 1px 2px rgba(0,0,0,.6); z-index: 2; pointer-events: none;
  }
  .key .max-flag {
    position: absolute; left: 3px; top: 2px;
    font-size: 8px; font-weight: 800; color: #fff; background: #ff5722;
    border-radius: 3px; padding: 0 3px; line-height: 12px;
    z-index: 2; display: none; pointer-events: none;
  }
  .key.is-max .max-flag { display: block; }
  .key.pressed {
    background: var(--amber) !important;
    color: #1a1d24 !important;
    transform: scale(1.06);
    box-shadow: 0 0 20px 5px rgba(255,213,79,.5);
    border-color: #ffe082;
    z-index: 5;
  }
  .w-wide { flex: 2.2 1 0; }
  .w-half { flex: 1.4 1 0; }
  .w-space { flex: 6.2 1 0; }
  .kb-grid { display: grid; gap: 5px; }
  .kb-grid .key { height: 40px; }

  /* ---------- 3D 视图 ---------- */
  #view3d {
    display: none;
    width: 100%;
    max-width: 1080px;
    height: 520px;
    background: #14161c;
    border: 1px solid #2e3444;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }
  #view3d .hint {
    position: absolute; left: 12px; bottom: 10px;
    font-size: 11px; color: var(--text-dim); z-index: 5; pointer-events: none;
  }

  /* ---------- 底部信息条 ---------- */
  .footer {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    width: 100%; max-width: 1080px; justify-content: center;
  }
  .stat {
    background: var(--panel); border: 1px solid #2e3444; border-radius: 8px;
    padding: 6px 12px; font-size: 11px; color: var(--text-dim); white-space: nowrap;
  }
  .stat b { color: var(--text); font-size: 13px; }
  .recent {
    flex: 1 1 auto; min-width: 180px; max-width: 360px;
    background: var(--panel); border: 1px solid #2e3444; border-radius: 8px;
    padding: 6px 10px; font-size: 11px; color: var(--text-dim);
    display: flex; align-items: center; gap: 5px; overflow: hidden;
  }
  .recent .chip {
    background: #343c4e; border-radius: 4px; padding: 1px 6px;
    font-family: Consolas, monospace; font-size: 11px; color: var(--amber);
    animation: chip-in .18s ease;
  }
  @keyframes chip-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- 鼠标显示 ---------- */
  .mouse {
    background: var(--panel); border: 1px solid #2e3444; border-radius: 10px;
    padding: 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .mouse-body {
    width: 44px; height: 60px; background: #3a4154;
    border: 2px solid #4a5268; border-radius: 14px 14px 18px 18px;
    position: relative; cursor: default;
  }
  .mouse-scroll {
    position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
    width: 4px; height: 14px; background: #6b7488; border-radius: 2px;
    transition: background .12s ease;
  }
  .mouse-btn {
    position: absolute; top: 26px; bottom: 2px; width: 45%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; color: rgba(255,255,255,.35);
    transition: background .12s ease, color .12s ease; border-radius: 0 0 14px 14px;
  }
  .mb-left { left: 2px; border-radius: 0 0 6px 12px; }
  .mb-right { right: 2px; border-radius: 0 0 12px 6px; }
  .mb-left.pressed, .mb-right.pressed { background: #4c9fe8; color: #fff; }
  .mouse-scroll.pressed { background: var(--amber); }
  .mouse-caption { font-size: 10px; color: var(--text-dim); white-space: nowrap; }

  /* ---------- 鼠标指针 ---------- */
  #cursor {
    position: fixed; width: 0; height: 0; z-index: 9999; pointer-events: none;
    border-left: 8px solid rgba(255,255,255,.95);
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    filter: drop-shadow(0 0 3px rgba(0,0,0,.8));
    display: none;
  }
  .click-ripple {
    position: fixed; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--amber); pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%);
    animation: ripple .45s ease-out forwards;
  }
  @keyframes ripple { from { opacity: 1; width: 10px; height: 10px; } to { opacity: 0; width: 46px; height: 46px; } }
</style>
</head>
<body>

  <div class="title">XAssistant <b>·</b> 键盘热力图（点击越多 → 越接近橙红）</div>

  <div class="toolbar">
    <span>键位：</span>
    <button class="layout-btn" data-layout="87">87 紧凑</button>
    <button class="layout-btn active" data-layout="104">104 全尺寸</button>
    <button class="layout-btn" data-layout="144">144 扩展</button>
    <span id="layoutName"></span>
    <div class="sep"></div>
    <span>模式：</span>
    <button class="mode-btn active" data-mode="2d">2D</button>
    <button class="mode-btn" data-mode="3d">3D</button>
    <button class="mode-btn" id="transBtn" title="切换背景透明，实现屏幕透视效果">背景：不透明</button>
  </div>

  <div id="view2d">
    <div class="keyboard" id="kb"></div>
  </div>

  <div id="view3d">
    <div class="hint">拖拽旋转 · 滚轮缩放 · 按键下沉为按下动画</div>
  </div>

  <div class="footer">
    <div class="stat">总按键：<b id="total">0</b></div>
    <div class="stat">当前上限：<b id="maxInfo">-</b></div>
    <div class="mouse" id="mouse">
      <div class="mouse-body">
        <div class="mouse-scroll" id="mbMiddle"></div>
        <div class="mouse-btn mb-left" id="mbLeft">L</div>
        <div class="mouse-btn mb-right" id="mbRight">R</div>
      </div>
      <div class="mouse-caption" id="mbCaption">左 0 · 中 0 · 右 0</div>
    </div>
    <div class="recent"><span>最近：</span><div id="recentKeys" style="display:flex;gap:5px;flex-wrap:wrap;"></div></div>
  </div>

  <div id="cursor"></div>

<script type="importmap">
{
  "imports": {
    "three": "./three/three.module.min.js",
    "three/addons/controls/OrbitControls.js": "./three/OrbitControls.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

(function () {
  "use strict";

  var counts = {};
  var keyEls = {};          // 2D: normalizedKey -> div
  var keyMeshes = {};       // 3D: normalizedKey -> THREE.Mesh
  var recentKeys = [];
  var MAX_RECENT = 15;
  var maxKey = null;
  var currentLayout = "104";
  var currentMode = "2d";
  var mouseCounts = { Left: 0, Middle: 0, Right: 0 };

  // ---------- 键定义辅助 ----------
  function K(k, label, w) { return { k: k, label: label, w: w || 1 }; }

  // ---------- 三套布局数据 ----------
  var MAIN_87 = [
    [K("esc","Esc"),K("f1","F1"),K("f2","F2"),K("f3","F3"),K("f4","F4"),K("f5","F5"),K("f6","F6"),K("f7","F7"),K("f8","F8"),K("f9","F9"),K("f10","F10"),K("f11","F11"),K("f12","F12")],
    [K("`","`"),K("1","1"),K("2","2"),K("3","3"),K("4","4"),K("5","5"),K("6","6"),K("7","7"),K("8","8"),K("9","9"),K("0","0"),K("-","-"),K("=","="),K("backspace","⌫ Backspace",2)],
    [K("tab","Tab ⇥",1.4),K("q","Q"),K("w","W"),K("e","E"),K("r","R"),K("t","T"),K("y","Y"),K("u","U"),K("i","I"),K("o","O"),K("p","P"),K("[","["),K("]","]"),K("\\","\\",1.4)],
    [K("caps lock","⇧ Caps",1.7),K("a","A"),K("s","S"),K("d","D"),K("f","F"),K("g","G"),K("h","H"),K("j","J"),K("k","K"),K("l","L"),K(";",";"),K("'","'"),K("enter","Enter ↵",2.2)],
    [K("shift","Shift ⇧",2.2),K("z","Z"),K("x","X"),K("c","C"),K("v","V"),K("b","B"),K("n","N"),K("m","M"),K(",",","),K(".","."),K("/","/"),K("right shift","Shift ⇧",2.6)],
    [K("ctrl","Ctrl",1.25),K("windows","Win",1.25),K("alt","Alt",1.25),K("space","Space",6.2),K("right alt","Alt",1.25),K("right windows","Win",1.25),K("menu","Menu",1.25),K("right ctrl","Ctrl",1.25)]
  ];

  var PAD_EDIT = [
    [K("insert","Ins"),K("home","Home"),K("pageup","PgUp")],
    [K("delete","Del"),K("end","End"),K("pagedown","PgDn")],
    [K("up","↑")],
    [K("left","←"),K("down","↓"),K("right","→")]
  ];

  var NUMPAD = {
    cols: 4,
    cells: [
      K("numlock","Num"),K("divide","/"),K("multiply","*"),K("subtract","-"),
      K("num7","7"),K("num8","8"),K("num9","9"),K("add","+",1),
      K("num4","4"),K("num5","5"),K("num6","6"),
      K("num1","1"),K("num2","2"),K("num3","3"),K("numenter","Enter",1),
      K("num0","0",2),K("decimal",".")
    ]
  };

  var MEDIA = [
    [K("media_prev","⏮"),K("media_play","▶"),K("media_next","⏭"),K("media_mute","🔇"),K("media_voldn","🔉"),K("media_volup","🔊"),
     K("media_mail","✉"),K("media_calc","🧮"),K("media_search","🔍"),K("media_pc","🖥"),K("media_browser","🌐"),K("media_sleep","💤")]
  ];

  var LAYOUTS = {
    "87": { name: "87 键 · 紧凑（TKL）", blocks: [ { side:"left", type:"main", rows: MAIN_87 } ] },
    "104": { name: "104 键 · 全尺寸", blocks: [
      { side:"left", type:"main", rows: MAIN_87 },
      { side:"right", type:"main", rows: PAD_EDIT },
      { side:"right", type:"grid", data: NUMPAD }
    ] },
    "144": { name: "144 键 · 扩展（含媒体键）", blocks: [
      { side:"left", type:"media", rows: MEDIA },
      { side:"left", type:"main", rows: MAIN_87 },
      { side:"right", type:"main", rows: PAD_EDIT },
      { side:"right", type:"grid", data: NUMPAD }
    ] }
  };

  // ---------- 键名规范化 ----------
  function normalizeKey(name) {
    var n = String(name || "").trim().toLowerCase().replace(/\s+/g, " ");
    var aliases = {
      "escape":"esc", "back space":"backspace", "backspace":"backspace",
      "capslock":"caps lock", "caps lock":"caps lock",
      "left shift":"shift", "left ctrl":"ctrl", "left alt":"alt",
      "right shift":"right shift", "right ctrl":"right ctrl", "right alt":"right alt",
      "left windows":"windows", "right windows":"windows", "win":"windows", "apps":"menu",
      "spacebar":"space", "return":"enter", "scroll":"scrolllock", "print screen":"prtsc",
      "page up":"pageup", "page down":"pagedown",
      "num lock":"numlock", "numlock":"numlock", "num lk":"numlock",
      "numpad 1":"num1", "num 1":"num1", "numpad1":"num1",
      "numpad 2":"num2", "num 2":"num2", "numpad2":"num2",
      "numpad 3":"num3", "num 3":"num3", "numpad3":"num3",
      "numpad 4":"num4", "num 4":"num4", "numpad4":"num4",
      "numpad 5":"num5", "num 5":"num5", "numpad5":"num5",
      "numpad 6":"num6", "num 6":"num6", "numpad6":"num6",
      "numpad 7":"num7", "num 7":"num7", "numpad7":"num7",
      "numpad 8":"num8", "num 8":"num8", "numpad8":"num8",
      "numpad 9":"num9", "num 9":"num9", "numpad9":"num9",
      "numpad 0":"num0", "num 0":"num0", "numpad0":"num0",
      "num enter":"numenter", "numpad enter":"numenter", "numpadenter":"numenter",
      "num .":"decimal", "numpad .":"decimal", "decimal":"decimal", "numpad decimal":"decimal",
      "num /":"divide", "divide":"divide", "numpad divide":"divide",
      "num *":"multiply", "multiply":"multiply", "numpad multiply":"multiply",
      "num -":"subtract", "subtract":"subtract", "numpad subtract":"subtract",
      "num +":"add", "add":"add", "numpad add":"add",
      "arrow up":"up", "arrow down":"down", "arrow left":"left", "arrow right":"right"
    };
    return aliases[n] || n;
  }

  // ---------- 热力色 ----------
  function heatColor(t) {
    var hue = 220 - 206 * t;
    var sat = 62 + 33 * t;
    var light = 32 + 26 * t;
    return "hsl(" + hue + ", " + sat + "%, " + light + "%)";
  }

  function computeStats() {
    var values = [];
    for (var k in counts) values.push(counts[k]);
    var max = values.length ? Math.max.apply(null, values) : 0;
    var total = values.reduce(function (a, b) { return a + b; }, 0);
    maxKey = null;
    for (var k in counts) { if (max > 0 && counts[k] === max && !maxKey) maxKey = k; }
    document.getElementById("total").textContent = total.toLocaleString();
    document.getElementById("maxInfo").textContent = maxKey ? maxKey + "（" + counts[maxKey].toLocaleString() + " 次）" : "-";
    return max;
  }

  // ================= 2D 渲染 =================
  function makeKey2D(kd) {
    var el = document.createElement("div");
    el.className = "key";
    el.setAttribute("data-k", kd.k);
    if (kd.w) el.style.flexGrow = kd.w;
    var span = document.createElement("span");
    span.className = "cap-label";
    span.textContent = kd.label;
    el.appendChild(span);
    var flag = document.createElement("span");
    flag.className = "max-flag";
    flag.textContent = "MAX";
    el.appendChild(flag);
    return el;
  }

  function collectKeys2D() {
    keyEls = {};
    document.querySelectorAll("#kb .key").forEach(function (el) {
      keyEls[normalizeKey(el.getAttribute("data-k"))] = el;
    });
  }

  function render2D(key) {
    var L = LAYOUTS[key];
    if (!L) return;
    var kb = document.getElementById("kb");
    kb.innerHTML = "";
    var left = document.createElement("div");
    left.className = "kb-left";
    var right = document.createElement("div");
    right.className = "kb-right";

    L.blocks.forEach(function (b) {
      var box = b.side === "right" ? right : left;
      if (b.type === "main" || b.type === "media") {
        var col = document.createElement("div");
        col.className = "kb-column";
        b.rows.forEach(function (row) {
          var r = document.createElement("div");
          r.className = "row";
          row.forEach(function (kd) { r.appendChild(makeKey2D(kd)); });
          col.appendChild(r);
        });
        box.appendChild(col);
      } else if (b.type === "grid") {
        var g = document.createElement("div");
        g.className = "kb-grid";
        g.style.gridTemplateColumns = "repeat(" + b.data.cols + ", 1fr)";
        b.data.cells.forEach(function (cell) {
          var el = makeKey2D(cell);
          if (cell.w > 1) el.style.gridColumn = "span " + cell.w;
          g.appendChild(el);
        });
        box.appendChild(g);
      }
    });

    if (right.childNodes.length) { kb.appendChild(left); kb.appendChild(right); }
    else kb.appendChild(left);

    collectKeys2D();
  }

  // ================= 3D 渲染 =================
  var scene, camera, renderer, controls;
  var keyGroup = null;
  var sceneReady = false;
  var pressTimers = {};
  var animId = null;

  // 布局 → 3D 键帽坐标 [{k, x, z, w}]
  function buildKeyCoords(layoutKey) {
    var L = LAYOUTS[layoutKey];
    var list = [];
    var leftMaxX = 0;

    L.blocks.forEach(function (b) {
      if (b.side === "right") return;
      if (b.type === "main" || b.type === "media") {
        var z = b.type === "media" ? -2 : 0;
        b.rows.forEach(function (row) {
          var x = 0;
          row.forEach(function (kd) {
            list.push({ k: kd.k, x: x, z: z, w: kd.w || 1 });
            x += (kd.w || 1);
          });
          if (x > leftMaxX) leftMaxX = x;
          z += 1;
        });
      }
    });

    var padX = leftMaxX + 2;
    L.blocks.forEach(function (b) {
      if (b.side !== "right") return;
      if (b.type === "main") {
        var z = 0;
        b.rows.forEach(function (row) {
          var x = padX;
          row.forEach(function (kd) { list.push({ k: kd.k, x: x, z: z, w: kd.w || 1 }); x += (kd.w || 1); });
          z += 1;
        });
      } else if (b.type === "grid") {
        var cols = b.data.cols;
        var z = 0;
        var x = padX + 1.5;
        b.data.cells.forEach(function (cell, i) {
          var w = cell.w || 1;
          list.push({ k: cell.k, x: x, z: z, w: w });
          x += w;
          if ((i + 1) % cols === 0) { z += 1; x = padX + 1.5; }
        });
      }
    });
    return list;
  }

  function makeLabelSprite(text, w) {
    var canvas = document.createElement("canvas");
    canvas.width = 128;
    canvas.height = 64;
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, 128, 64);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 34px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, 64, 32);
    var tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    var sp = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false })
    );
    sp.scale.set(Math.max(w * 0.85, 0.6), 0.42, 1);
    sp.position.set(0, 0.33, 0);
    return sp;
  }

  function init3D() {
    var container = document.getElementById("view3d");
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x14161c);

    var w = container.clientWidth, h = container.clientHeight;
    camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 400);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    var dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(20, 34, 14);
    dir.castShadow = true;
    dir.shadow.mapSize.set(2048, 2048);
    dir.shadow.camera.left = -25;
    dir.shadow.camera.right = 25;
    dir.shadow.camera.top = 25;
    dir.shadow.camera.bottom = -25;
    scene.add(dir);
    var rim = new THREE.DirectionalLight(0x88bbff, 0.35);
    rim.position.set(-15, 12, -10);
    scene.add(rim);

    sceneReady = true;
    animate();
  }

  function build3DKeyboard(layoutKey) {
    if (!sceneReady) return;
    if (keyGroup) scene.remove(keyGroup);
    keyGroup = new THREE.Group();
    keyMeshes = {};

    var coords = buildKeyCoords(layoutKey);
    var maxX = 0, maxZ = 0;
    coords.forEach(function (c) {
      if (c.x + c.w > maxX) maxX = c.x + c.w;
      if (-c.z > maxZ) maxZ = -c.z;
    });
    maxZ += 1;

    // 底座
    var baseW = maxX + 1.6, baseD = maxZ + 1.6;
    var base = new THREE.Mesh(
      new THREE.BoxGeometry(baseW, 0.5, baseD),
      new THREE.MeshStandardMaterial({ color: 0x232833, roughness: 0.85, metalness: 0.15 })
    );
    base.position.set(maxX / 2 - 0.4, -0.32, -(maxZ - 1) / 2 + 0.3);
    base.receiveShadow = true;
    keyGroup.add(base);

    var keyGeo = new THREE.BoxGeometry(0.94, 0.42, 0.94);
    coords.forEach(function (c) {
      var w = c.w;
      var geo = w > 1.01
        ? new THREE.BoxGeometry(w - 0.06, 0.42, 0.94)
        : keyGeo;
      var mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0x1f3a5f),
        roughness: 0.55,
        metalness: 0.25,
      });
      var mesh = new THREE.Mesh(geo, mat);
      var z3 = -c.z;
      mesh.position.set(c.x + w / 2 - 0.4, 0, z3 + 0.3);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.baseY = 0;
      mesh.add(makeLabelSprite(c.k === "space" ? "Space" : c.k === "media_play" ? "▶" : c.k.toUpperCase(), w));
      keyGroup.add(mesh);
      keyMeshes[normalizeKey(c.k)] = mesh;
    });

    scene.add(keyGroup);
    applyHeat3D();

    // 相机定位
    var midX = maxX / 2 - 0.4, midZ = -(maxZ - 1) / 2 + 0.3;
    camera.position.set(midX + 17, 15, midZ + 17);
    controls.target.set(midX, 0, midZ);
    controls.update();
  }

  function heatColor3D(t) {
    var hue = 220 - 206 * t;
    var sat = 0.62 + 0.33 * t;
    var light = 0.32 + 0.26 * t;
    var c = new THREE.Color();
    c.setHSL(hue / 360, sat, light);
    return c;
  }

  function applyHeat3D() {
    if (!sceneReady) return;
    var max = computeStats();
    for (var nk in keyMeshes) {
      var mesh = keyMeshes[nk];
      var c = counts[nk] || 0;
      var t = max > 0 ? c / max : 0;
      mesh.material.color.set(heatColor3D(t));
      var isMax = max > 0 && c === max;
      mesh.material.emissive.set(isMax ? new THREE.Color(0xff5722) : new THREE.Color(0x000000));
      mesh.material.emissiveIntensity = isMax ? 0.45 : 0;
    }
  }

  function press3D(key) {
    var nk = normalizeKey(key);
    var mesh = keyMeshes[nk];
    if (!mesh) return;
    mesh.position.y = -0.12;
    mesh.material.emissive.set(new THREE.Color(0xffd54f));
    mesh.material.emissiveIntensity = 0.9;
    if (pressTimers[nk]) clearTimeout(pressTimers[nk]);
    pressTimers[nk] = setTimeout(function () {
      mesh.position.y = 0;
      applyHeat3D();
    }, 240);
  }

  function animate() {
    animId = requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  function resize3D() {
    if (!sceneReady) return;
    var container = document.getElementById("view3d");
    var w = container.clientWidth, h = container.clientHeight;
    if (w > 0 && h > 0) {
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
  }
  window.addEventListener("resize", resize3D);

  // ---------- 布局 / 模式切换 ----------
  function updateLayoutName(key) {
    document.getElementById("layoutName").textContent = LAYOUTS[key].name;
    document.querySelectorAll(".layout-btn").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-layout") === key);
    });
  }

  document.querySelectorAll(".layout-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      currentLayout = btn.getAttribute("data-layout");
      render2D(currentLayout);
      applyHeat2D();
      updateLayoutName(currentLayout);
      if (currentMode === "3d") build3DKeyboard(currentLayout);
    });
  });

  document.querySelectorAll(".mode-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      showMode(btn.getAttribute("data-mode"));
    });
  });

  function showMode(mode) {
    currentMode = mode;
    document.getElementById("view2d").style.display = mode === "2d" ? "" : "none";
    var v3 = document.getElementById("view3d");
    v3.style.display = mode === "3d" ? "" : "none";
    document.querySelectorAll(".mode-btn").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-mode") === mode);
    });
    if (mode === "3d") {
      if (!sceneReady) { init3D(); build3DKeyboard(currentLayout); }
      else { build3DKeyboard(currentLayout); resize3D(); }
    }
  }

  // ---------- 透明背景（透视模式） ----------
  var isTransparent = localStorage.getItem("xassist_transparent") === "1";
  function applyTransparent() {
    document.body.classList.toggle("transparent", isTransparent);
    var btn = document.getElementById("transBtn");
    if (btn) btn.textContent = isTransparent ? "背景：透明" : "背景：不透明";
  }
  var transBtn = document.getElementById("transBtn");
  if (transBtn) {
    transBtn.addEventListener("click", function () {
      isTransparent = !isTransparent;
      localStorage.setItem("xassist_transparent", isTransparent ? "1" : "0");
      applyTransparent();
    });
  }
  applyTransparent();

  // ---------- 2D 热力 / 动画 ----------
  function applyHeat2D() {
    var max = computeStats();
    for (var k in keyEls) {
      var el = keyEls[k];
      var c = counts[k] || 0;
      var t = max > 0 ? c / max : 0;
      el.style.background = heatColor(t);
      el.classList.toggle("is-max", max > 0 && c === max);
      var badge = el.querySelector(".badge");
      if (c > 0) {
        if (!badge) { badge = document.createElement("span"); badge.className = "badge"; el.appendChild(badge); }
        badge.textContent = c.toLocaleString();
      } else if (badge) { badge.remove(); }
    }
  }

  function playPress2D(key) {
    var el = keyEls[key];
    if (!el) return;
    el.classList.remove("pressed");
    void el.offsetWidth;
    el.classList.add("pressed");
    setTimeout(function () { el.classList.remove("pressed"); }, 240);
  }

  function pushRecent(key) {
    recentKeys.push(key);
    if (recentKeys.length > MAX_RECENT) recentKeys.shift();
    var box = document.getElementById("recentKeys");
    box.innerHTML = "";
    for (var i = recentKeys.length - 1; i >= 0; i--) {
      var chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = recentKeys[i];
      box.appendChild(chip);
    }
  }

  // ---------- 鼠标 ----------
  var cursor = document.getElementById("cursor");

  function onMouseMove(nx, ny) {
    cursor.style.display = "block";
    cursor.style.left = (nx * 100) + "%";
    cursor.style.top = (ny * 100) + "%";
  }

  function rippleAt(nx, ny) {
    var r = document.createElement("div");
    r.className = "click-ripple";
    r.style.left = (nx * 100) + "%";
    r.style.top = (ny * 100) + "%";
    document.body.appendChild(r);
    setTimeout(function () { r.remove(); }, 500);
  }

  function flashBtn(id) {
    var el = document.getElementById(id);
    el.classList.remove("pressed");
    void el.offsetWidth;
    el.classList.add("pressed");
    setTimeout(function () { el.classList.remove("pressed"); }, 220);
  }

  function onMouseClick(button, nx, ny) {
    if (mouseCounts[button] === undefined) return;
    mouseCounts[button]++;
    document.getElementById("mbCaption").textContent =
      "左 " + mouseCounts.Left + " · 中 " + mouseCounts.Middle + " · 右 " + mouseCounts.Right;
    if (button === "Left") flashBtn("mbLeft");
    else if (button === "Right") flashBtn("mbRight");
    else flashBtn("mbMiddle");
    rippleAt(nx, ny);
    onMouseMove(nx, ny);
  }

  // ---------- 消息处理 ----------
  function onPress(key, count) {
    var nk = normalizeKey(key);
    counts[nk] = count;
    playPress2D(nk);
    if (currentMode === "3d") press3D(key);
    pushRecent(key);
    applyHeat2D();
    if (currentMode === "3d") applyHeat3D();
  }

  function onInit(payload) {
    counts = {};
    if (payload && payload.counts) {
      for (var k in payload.counts) {
        if (Object.prototype.hasOwnProperty.call(payload.counts, k)) {
          counts[normalizeKey(k)] = payload.counts[k];
        }
      }
    }
    applyHeat2D();
    if (currentMode === "3d") applyHeat3D();
  }

  function handleMessage(data) {
    var msg = null;
    try { msg = typeof data === "string" ? JSON.parse(data) : data; } catch (e) { return; }
    if (!msg || !msg.type) return;
    if (msg.type === "press") onPress(msg.key, msg.count);
    else if (msg.type === "init") onInit(msg);
    else if (msg.type === "mouseClick") onMouseClick(msg.button, msg.x, msg.y);
    else if (msg.type === "mouseMove") onMouseMove(msg.x, msg.y);
    else if (msg.type === "setLayout") {
      currentLayout = String(msg.layout);
      render2D(currentLayout);
      applyHeat2D();
      updateLayoutName(currentLayout);
      if (currentMode === "3d") build3DKeyboard(currentLayout);
    }
  }

  if (window.chrome && window.chrome.webview && window.chrome.webview.addEventListener) {
    window.chrome.webview.addEventListener("message", function (e) { handleMessage(e.data); });
  } else if (window.parent && window.parent.chrome && window.parent.chrome.webview) {
    window.parent.chrome.webview.addEventListener("message", function (e) { handleMessage(e.data); });
  }

  // 初次渲染
  render2D("104");
  applyHeat2D();
  updateLayoutName("104");
})();
</script>
</body>
</html>
